<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>openzhicheng</title>
    <meta name="description" content="Zhicheng's corner for fun pages and files." />
    <link rel="icon" media="(prefers-color-scheme:dark)" href="/assets/img/favicon-dark.png" type="image/png" />
    <link rel="icon" media="(prefers-color-scheme:light)" href="/assets/img/favicon.png" type="image/png" />
    <link rel="stylesheet" href="./fun.css" />
</head>
<body>
    <!-- To add a fun page: create openzhicheng/<slug>/index.html and add a card below. -->
    <div class="page">
        <h1>openzhicheng</h1>
        <p class="subtitle">Fun pages, small experiments, and files worth sharing.</p>

        <ul class="fun-list">
            <li>
                <a class="card" href="./canele/">
                    <img class="emoji" src="/assets/emoji/custard.png" alt="" width="44" height="44" />
                    <span>
                        <span class="card-title">The Canelé Recipe</span>
                        <span class="card-desc" style="display:block">Custardy inside, deeply caramelized outside. Plan two days ahead.</span>
                    </span>
                </a>
            </li>
            <li>
                <a class="card" href="/garden/">
                    <img class="emoji" src="/assets/emoji/seedling.png" alt="" width="44" height="44" />
                    <span>
                        <span class="card-title">Garden</span>
                        <span class="card-desc" style="display:block">Live dashboard for my vegetables and house plants.</span>
                    </span>
                </a>
            </li>
        </ul>

        <footer class="fun-footer">
            <a href="/">← zhicheng's homepage</a>
        </footer>
    </div>
</body>
</html>
