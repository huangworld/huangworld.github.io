<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Garden</title>
    <meta name="description" content="Zhicheng's plant and vegetable tracker." />
    <meta name="robots" content="noindex" />
    <link rel="icon" media="(prefers-color-scheme:dark)" href="/assets/img/favicon-dark.png" type="image/png" />
    <link rel="icon" media="(prefers-color-scheme:light)" href="/assets/img/favicon.png" type="image/png" />
    <link rel="stylesheet" href="./garden.css" />
</head>
<body>
    <header class="topbar">
        <h1 id="view-title">Today</h1>
        <button id="refresh-btn" class="icon-btn" title="Refresh" aria-label="Refresh">↻</button>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main id="main" aria-live="polite"></main>

    <nav class="tabbar">
        <a href="#/" data-tab="today"><img class="tab-icon" src="/assets/emoji/sun.png" alt="" width="22" height="22" />Today</a>
        <a href="#/all" data-tab="all"><img class="tab-icon" src="/assets/emoji/potted-plant.png" alt="" width="22" height="22" />Plants</a>
        <a href="#/add" data-tab="add"><img class="tab-icon" src="/assets/emoji/plus.png" alt="" width="22" height="22" />Add</a>
        <a href="#/settings" data-tab="settings"><img class="tab-icon" src="/assets/emoji/gear.png" alt="" width="22" height="22" />Settings</a>
    </nav>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
